package:
  name: axi_tmu

dependencies:
  common_cells:       { git: "https://github.com/pulp-platform/common_cells.git",       version: 1.32.0 }
  axi:                { git: "https://github.com/pulp-platform/axi.git",                version: 0.39.1 }
  register_interface: { git: "https://github.com/pulp-platform/register_interface.git", version: 0.4.2  }

  
sources:
  # Source files grouped in levels. Files in level 0 have no dependencies on files in this
  # package. Files in level 1 only depend on files in level 0, files in level 2 on files in
  # levels 1 and 0, etc. Files within a level are ordered alphabetically.

  - target: rtl
    files:
      # Level 0
      - src/registers/axi_tmu_ilt_reg_pkg.sv
      - src/registers/axi_tmu_ilt_reg_top.sv
      - src/registers/axi_tmu_clt_reg_pkg.sv
      - src/registers/axi_tmu_clt_reg_top.sv
      - src/registers/axi_tmu_plt_reg_pkg.sv
      - src/registers/axi_tmu_plt_reg_top.sv
      - src/rtl/tmu_timebase.sv
      - src/rtl/tmu_sticky.sv
      - src/rtl/tmu_id_remap.sv
      - src/rtl/tmu_hs_counter.sv
      - src/rtl/axi_tmu_pkg.sv
      - src/rtl/tmu_wr_inflight_ilt.sv
      - src/rtl/tmu_rd_inflight_ilt.sv
      - src/rtl/write_guard_ilt.sv
      - src/rtl/read_guard_ilt.sv
      - src/rtl/tmu_wr_inflight_clt.sv
      - src/rtl/tmu_rd_inflight_clt.sv
      - src/rtl/write_guard_clt.sv
      - src/rtl/read_guard_clt.sv
      - src/rtl/tmu_wr_inflight_plt.sv
      - src/rtl/tmu_rd_inflight_plt.sv
      - src/rtl/write_guard_plt.sv
      - src/rtl/read_guard_plt.sv
      - src/rtl/axi_tmu_top.sv
  
  - target: tmu_synth
    files:
      - src/rtl/axi_tmu_pkg.sv
      - src/rtl/axi_tmu_wrap.sv

  - target: netlist_sim
    files:
      - /usr/pack/gf-12-kgf/arm/gf/12lpplus/sc7p5mcpp84_base_lvt_c18/r5p0/verilog/sc7p5mcpp84_12lpplus_base_lvt_c18.v
      - monitor-synth/synopsys/out/tmu_wrap_sspg_0p72v_125c_1ns/netlist_tmu_wrap.v
      - test/tb_axi_tmu_ilt.sv

  - target: tmu_test
    files:
       # Level 0
      - src/rtl/axi_tmu_pkg.sv
      - test/tb_axi_tmu_ilt.sv
      - test/tb_axi_tmu_clt.sv
      - test/tb_axi_tmu_plt.sv